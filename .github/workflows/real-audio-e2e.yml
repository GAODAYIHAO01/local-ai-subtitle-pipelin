name: Real audio ASR verification

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evidence/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[asr]'
      - name: Install FFmpeg / ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Download public real speech sample
        run: |
          mkdir -p sample_media
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/openai/whisper/main/tests/jfk.flac \
            --output sample_media/jfk.flac
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 sample_media/jfk.flac
          sha256sum sample_media/jfk.flac
      - name: Run unit tests and real model inference
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify_e2e.py \
            --input sample_media/jfk.flac \
            --output-dir outputs \
            --report-dir evidence \
            --model tiny
      - name: Upload reproducible evidence artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-audio-e2e-evidence
          path: evidence/
          retention-days: 30
      - name: Commit measured evidence to repository
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f evidence/verification.log evidence/verification.md evidence/subtitles.srt evidence/subtitles.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: publish measured transcription evidence [skip ci]'
            git push origin HEAD:main
          fi
